<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Drawing Renamer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h2>Drawing Renamer</h2>
      <div class="row">
        <input id="register" class="wide" placeholder="Path to register PDF or the folder containing it" />
        <button id="choose">Choose folder...</button>
        <button id="choose-file">Choose PDF...</button>
        <button id="load">Load</button>
      </div>
      <div class="row toolbar">
        <span id="summary" class="muted">No register loaded.</span>
        <label class="inline"><input type="checkbox" id="hide-empty" /> Hide missing drawings</label>
        <span id="watching" class="muted"></span>
        <span class="actions">
          <button id="make-folder" disabled title="Put the selected drawings in a folder">MAKE FOLDER</button>
          <button id="rename" class="primary" disabled>RENAME</button>
        </span>
      </div>
    </header>

    <main id="table-wrap">
      <table id="drawings">
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" id="check-all" checked title="Select all" /></th>
            <th class="col-number">Drawing No.</th>
            <th>Register title</th>
            <th>Current file</th>
            <th>New name</th>
            <th class="col-status">Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="muted">Choose a register PDF or the folder containing it.</div>
    </main>

    <footer>
      <div class="log-header">
        <h3>Log</h3>
        <button id="clear-log">Clear</button>
      </div>
      <div id="log"></div>
    </footer>

    <dialog id="folder-dialog">
      <form>
        <h3 id="folder-dialog-title">Put drawings in folder</h3>
        <p class="muted">Folders are created inside the register's folder. Use &gt; or \ for subfolders. Files are moved when you press RENAME.</p>
        <input id="folder-name" list="folder-list" placeholder="e.g. Plans or Plans > Houses > House 1" autocomplete="off" />
        <datalist id="folder-list"></datalist>
        <div id="folder-error"></div>
        <div class="dialog-buttons">
          <!-- OK comes first so Enter in the text box means OK; shown right-to-left -->
          <button type="submit" value="ok" class="primary">OK</button>
          <button type="submit" value="cancel">Cancel</button>
          <button type="submit" value="remove" class="left">Remove from folder</button>
        </div>
      </form>
    </dialog>

    <script src="js/pdfjs/pdf.js"></script>
    <script src="js/neutralino.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
